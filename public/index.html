<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>splitty</title>
  <link rel="stylesheet" href="/style.css?v=33">
</head>
<body>

  <!-- landing -->
  <div id="landing" class="hidden">
    <div class="landing-inner">
      <h1>splitty</h1>
      <p class="tagline">Video conversations that happen in the moment — even when you're not.</p>
      <button id="create-chat" class="btn-primary">Create a chat</button>
      <div id="recent-chats"></div>
    </div>
  </div>

  <!-- chat -->
  <div id="chat" class="hidden">
    <header id="chat-header">
      <a href="/" class="logo">splitty</a>
      <div class="header-actions">
        <button id="gaps-btn" class="btn-ghost" title="Show or hide pauses in transcripts">Hide pauses</button>
        <button id="name-btn" class="btn-ghost" title="Change your display name"></button>
        <button id="copy-link" class="btn-ghost">Copy invite link</button>
      </div>
    </header>

    <div id="stage" class="hidden">
      <div id="video-box">
        <video id="player-a" playsinline></video>
        <video id="player-b" playsinline class="hidden"></video>
        <video id="preview" playsinline muted class="hidden"></video>
        <div id="pip-label"></div>
        <button id="fit-btn" title="Toggle fill / fit">Fit</button>
        <button id="cam-enable" class="hidden">Turn on camera</button>
      </div>
      <div id="transport">
        <div id="scrub-wrap">
          <div id="ticks"></div>
          <div id="drop-ghost" class="hidden"></div>
          <input id="scrubber" type="range" min="0" max="100" step="0.01" value="0">
        </div>
        <div id="transport-row">
          <button id="btn-back" class="t-btn" title="Back 10s"><span class="ti">↺</span>10s</button>
          <button id="btn-stop" class="t-btn t-play" title="Stop — next recording starts a new message">
            <svg class="ic" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>
          </button>
          <button id="btn-play" class="t-btn t-play playing" title="Play/pause">
            <svg class="ic ic-play" viewBox="0 0 16 16"><path d="M4.5 2.2 13.5 8l-9 5.8z"/></svg>
            <svg class="ic ic-pause" viewBox="0 0 16 16"><path d="M3.5 2.5h3.4v11H3.5zM9.1 2.5h3.4v11H9.1z"/></svg>
          </button>
          <button id="btn-fwd" class="t-btn" title="Forward 10s">10s<span class="ti">↻</span></button>
          <button id="btn-speed" class="t-btn" title="Playback speed">1×</button>
          <span id="time-label">0:00 / 0:00</span>
        </div>
      </div>
    </div>

    <div id="splitter"></div>

    <main id="messages"></main>

    <div id="toast" class="hidden">
      <span id="toast-msg"></span>
      <button id="toast-btn" class="hidden">Undo</button>
    </div>

    <footer id="controls">
      <div id="rec-hint"></div>
      <button id="stop-btn" class="hidden" title="Stop — next recording starts a new message">
        <span class="stop-square"></span>
      </button>
      <button id="rec-btn" aria-label="record">
        <span class="rec-dot"></span>
      </button>
    </footer>
  </div>

  <!-- admin -->
  <div id="admin" class="hidden">
    <div class="admin-inner">
      <h1>splitty admin</h1>
      <form id="admin-login" class="hidden">
        <input id="admin-pass" type="password" placeholder="Password" autocomplete="current-password">
        <button class="btn-primary">Enter</button>
      </form>
      <div id="admin-tabs" class="hidden">
        <button id="tab-chats" class="tab active">Chats</button>
        <button id="tab-users" class="tab">Users</button>
        <input id="admin-search" type="search" placeholder="Search by name or email…">
      </div>
      <div id="admin-list"></div>
    </div>
  </div>

  <!-- name gate / sign in -->
  <div id="name-gate" class="hidden">
    <div id="gate-card">
      <form id="name-form">
        <h2>Who are you?</h2>
        <p>Pick a name so people know who's talking.</p>
        <input id="name-input" type="text" maxlength="40" placeholder="Your name" autocomplete="name" required>
        <button type="submit" class="btn-primary">Join chat</button>
      </form>
      <div id="auth-box" class="hidden">
        <h2>Sign in to splitty</h2>
        <p>So your messages follow you everywhere.</p>
        <a id="google-btn" class="auth-btn hidden" href="#">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign in with Google</span>
        </a>
        <div id="auth-or" class="hidden"><span>or</span></div>
        <form id="email-form" class="hidden">
          <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email" required>
          <button type="submit" class="btn-primary auth-btn">Email me a sign-in link</button>
        </form>
        <p id="auth-note" class="muted"></p>
      </div>
    </div>
  </div>

  <script src="/app.js?v=33"></script>
</body>
</html>
